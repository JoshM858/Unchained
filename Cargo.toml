[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
repository = "https://github.com/JoshM858/Unbound"

[workspace.dependencies]
unchained-protocol = { path = "crates/protocol" }
unchained-core = { path = "crates/core" }
unchained-server = { path = "crates/server" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
