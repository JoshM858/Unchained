name: Interface demo

# Publishes the simulated interface demo (web/demo.html) to GitHub Pages.
# Requires Settings -> Pages -> Source set to "GitHub Actions".
on:
  push:
    branches: [main, claude/sharp-babbage-ytz53p, claude/peaceful-mccarthy-vviq1q]
    paths: ["web/**", "scripts/build-demo.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-demo.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
